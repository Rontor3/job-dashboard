[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-dashboard"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Scope collection to this project's tests. Without this, a bare `pytest`
# also sweeps in vendor/ai-job-search/tests/ (a second `tests` package),
# which collides with ours and errors during collection.
testpaths = ["tests"]
